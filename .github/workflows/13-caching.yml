name: 13 - Using Caching

on:
  workflow_dispatch:
    inputs:
      use-cache:
        description: "Whether to use caching"
        type: boolean
        default: true

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20.x"

      - name: Install dependencies
        # W PowerShellu na Windows używamy ukośnika wstecznego `\`
        working-directory: 13-caching\react-app
        run: npm install

      - name: Testing
        working-directory: 13-caching\react-app
        run: npm run test

      - name: Build
        working-directory: 13-caching\react-app
        run: npm run build

      - name: Deploy to nonprod environment
        run: echo "Deploying to nonprod environment"
