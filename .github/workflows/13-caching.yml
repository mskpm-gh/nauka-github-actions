name: 13 - Using Caching

on:
  workflow_dispatch:
    inputs:
      use-cache:
        description: "Whether to use caching"
        type: boolean
        default: true
      node-version:
        description: "Node.js version to use"
        type: choice
        options:
          - "21.x"
          - "20.x"
          - "18.x"
          - "16.x"
        default: "20.x"

jobs:
  build:
    runs-on: self-hosted
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ inputs.node-version }}

      - name: Download cache dependencies
        uses: actions/cache@v3
        if: ${{ inputs.use-cache }}
        id: cache
        with:
          path: 13-caching/react-app/node_modules
          key: deps-node-modules-${{hashFiles('13-caching/react-app/package-lock.json')}}

      - name: Install dependencies
        working-directory: 13-caching/react-app
        if: steps.cache.outputs.cache-hit != 'true' || !inputs.use-cache
        run: npm install

      - name: Testing
        working-directory: 13-caching/react-app
        run: npm run test

      - name: Build
        working-directory: 13-caching/react-app
        run: npm run build

      - name: Deploy to nonprod environment
        run: echo "Deploying to nonprod environment"
