name: 13 - Using Caching

on:
  workflow_dispatch:
    inputs:
      use-cache:
        description: "Whether to use caching"
        type: boolean
        default: true

jobs:
  build:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: 13-caching/react-app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20.x"
      - name: Install dependencies
        run: npm ci
      - name: Teststing
        run: npm runtest
      - name: Build
        run: npm run build
      - name: Deploy to nonprod environment
        run: echo "Deploying to nonprod environment"
