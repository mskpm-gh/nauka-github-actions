name: 13 - Using Caching

on:
  workflow_dispatch:
    inputs:
      use-cache:
        description: "Whether to use caching"
        type: boolean
        default: true
      node-version:
        description: "Node.js version to use"
        type: choice
        options:
          - "21.x"
          - "20.x"
          - "18.x"
          - "16.x"
        default: "20.x"

jobs:
  install-dependencies:
    runs-on: self-hosted
    defaults:
      run:
        shell: bash
    outputs:
      deps-cache-key: ${{ steps.cache-key.outputs.CACHE_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ inputs.node-version }}

      - name: Calculate cache key
        id: cache-key
        run: |
          echo "CACHE_KEY=deps-node-modules-${{ runner.os }}-${{ runner.arch }}-${{ inputs.node-version }}-${{ hashFiles('13-caching/react-app/package-lock.json') }}" >> "$GITHUB_OUTPUT"

      - name: Download cache dependencies
        uses: actions/cache@v4
        if: ${{ inputs.use-cache }}
        id: cache
        with:
          path: 13-caching/react-app/node_modules
          key: ${{ steps.cache-key.outputs.CACHE_KEY }}

      - name: Install dependencies
        working-directory: 13-caching/react-app
        if: steps.cache.outputs.cache-hit != 'true' || !inputs.use-cache
        run: npm ci

  lint-test:
    runs-on: self-hosted
    needs: install-dependencies
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ inputs.node-version }}

      - name: Download cache dependencies
        uses: actions/cache@v4
        if: ${{ inputs.use-cache }}
        id: cache
        with:
          path: 13-caching/react-app/node_modules
          key: ${{ needs.install-dependencies.outputs.deps-cache-key }}

      - name: Install dependencies
        working-directory: 13-caching/react-app
        if: steps.cache.outputs.cache-hit != 'true' || !inputs.use-cache
        run: npm ci

      - name: Testing
        working-directory: 13-caching/react-app
        run: npm run test

      - name: Lint
        working-directory: 13-caching/react-app
        run: echo "Linting..."

      - name: Deploy to nonprod environment
        run: echo "Deploying to nonprod environment"

  build:
    runs-on: self-hosted
    needs: install-dependencies
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ inputs.node-version }}

      - name: Download cache dependencies
        uses: actions/cache@v4
        if: ${{ inputs.use-cache }}
        id: cache
        with:
          path: 13-caching/react-app/node_modules
          key: ${{ needs.install-dependencies.outputs.deps-cache-key }}

      - name: Install dependencies
        working-directory: 13-caching/react-app
        if: steps.cache.outputs.cache-hit != 'true' || !inputs.use-cache
        run: npm ci

      - name: Build
        working-directory: 13-caching/react-app
        run: npm run build
