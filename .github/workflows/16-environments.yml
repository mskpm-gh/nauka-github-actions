name: 16 - working with Environments
run-name: 16 - working with Environments | env - ${{ inputs.target-env }}
defaults:
  run:
    shell: bash
on:
  workflow_dispatch:
    inputs:
      target-env:
        type: environment
        default: staging
jobs:
  echo:
    runs-on: self-hosted
    environment: ${{ inputs.target-env }}
    env:
      my-env-value: ${{ vars.MY_ENV_VALUE || 'default_value' }}
    steps:
      - name: Echo vars
        run: |
          echo "Env variable ${{ env.my-env-value }}"
