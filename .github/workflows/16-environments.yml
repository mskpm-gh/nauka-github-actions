name: 16 - working with Environments

defaults:
  run:
    shell: bash
on:
  workflow_dispatch:

jobs:
  echo-staging:
    runs-on: self-hosted
    environment: staging
    env:
      my-env-value: ${{ vars.MY_ENV_VALUE || 'default_value' }}
    steps:
      - name: Echo vars
        run: |
          echo "Deploying to staging environment"

  e2e-tests:
    runs-on: self-hosted
    needs: echo-staging
    steps:
      - name: e2e tests
        run: |
          echo "Running e2e tests in staging environment"

  deploy-prod-frontend-1:
    runs-on: self-hosted
    needs: e2e-tests
    environment: prod
    env:
      my-env-value: ${{ vars.MY_ENV_VALUE || 'default_value' }}
    steps:
      - name: Echo vars
        run: |
          echo "Deploying to prod frontend 1"

  deploy-prod-backend-1:
    runs-on: self-hosted
    needs: e2e-tests
    environment: prod
    env:
      my-env-value: ${{ vars.MY_ENV_VALUE || 'default_value' }}
    steps:
      - name: Echo vars
        run: |
          echo "Deploying to prod backend 1"

  deploy-prod-backend-2:
    runs-on: self-hosted
    needs: e2e-tests
    environment: prod
    env:
      my-env-value: ${{ vars.MY_ENV_VALUE || 'default_value' }}
    steps:
      - name: Echo vars
        run: |
          echo "Deploying to prod backend 2"
