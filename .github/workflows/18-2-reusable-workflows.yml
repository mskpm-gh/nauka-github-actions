name: 18.2 Reusable Workflows

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    uses: ./.github/workflows/18-1-reusable-workflow.yml
    with:
      target_directory: dummy_dir
  print_outputs:
    runs-on: self-hosted
    needs: deploy
    steps:
      - name: Print outputs
        run: |
          echo Build status: ${{ needs.deploy.outputs.build-status }}
          echo Url: ${{ needs.deploy.outputs.url }}
