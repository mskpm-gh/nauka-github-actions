name: 17 - 1 - Custom Actions Composite
run-name: 17 - 1 - Custom Actions Composite | env - ${{ inputs.target-env }}

defaults:
  run:
    shell: bash
on:
  workflow_dispatch:
    inputs:
      target-env:
        description: '"dev" or "prod" Controls whether to install dev dependencies or not'
        type: choice
        options:
          - dev
          - prod
        default: dev
        required: false
env:
  working-directory: 17-custom-actions/react-app

jobs:
  build:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: ${{ env.working-directory }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node and NPM Dependencies
        id: setup-deps
        uses: ./.github/actions/composite-cache-deps
        with:
          node-version: 20.x
          working-directory: ${{ env.working-directory }}
          target-env: ${{ inputs.target-env }}

      - name: Output installed dependencies status
        run: |
          echo "Installed dependencies: ${{ steps.setup-deps.outputs.installed-deps }}"

      - name: Run tests
        run: npm run test

      - name: Build project
        run: npm run build
