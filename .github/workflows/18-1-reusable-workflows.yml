name: 18.1 - Reusable Workflows - Reusable Definition
on:
  workflow_dispatch:
    inputs:
      target-directory:
        type: string
        required: false

  workflow_call:
    inputs:
      target-directory:
        type: string
        required: false
    outputs:
      build-status:
        description: The status of the build process
        value: ${{ jobs.deploy.outputs.build-status }}
      url:
        description: The URL of the deployed version
        value: ${{ jobs.deploy.outputs.url }}

jobs:
  deploy:
    runs-on: self-hosted
    outputs:
      build-status: ${{ steps.build.outputs.build-status }}
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Build
        id: build
        run: |
          echo Building project in ${{ inputs.target-directory }}
          echo "build-status=success" >> $GITHUB_OUTPUT
      - name: Deploy
        id: deploy
        run: |
          echo "Deploying build artifacts"
          echo "url=https://google.com" >> $GITHUB_OUTPUT
