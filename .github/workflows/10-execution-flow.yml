name: 10 - Controlling the execution Flow
on:
  workflow_dispatch:
    inputs:
      pass-unit-tests:
        type: boolean
        description: Whether the tests will pass or fail
        default: true

# GLOBALNE USTAWIENIE: Zabezpiecza cały plik na Windows 11 przed zawieszaniem okien
defaults:
  run:
    shell: pwsh

jobs:
  # Lint and Build job
  lint-build:
    runs-on: self-hosted
    steps:
      - name: Simulate Lint and Build
        run: |
          Write-Host "Simulating Lint and Build"

  # Unit Test job
  unit-test:
    runs-on: self-hosted
    steps:
      - name: Simulate Unit Tests
        run: |
          Write-Host "Simulating Unit Tests"
      - name: Failing test
        if: ${{ !inputs.pass-unit-tests }}
        # Bezpieczne i natywne zamknięcie procesu w PowerShell Core
        run: $host.SetShouldExit(1)

  # Deploy to Non-Prod job
  deploy-nonprod:
    runs-on: self-hosted
    needs:
      - lint-build
      - unit-test
    steps:
      - name: Simulate Deploy to Non-Prod
        run: |
          Write-Host "Simulating Deploy to Non-Prod"

  # E2E Tests job
  e2e-tests:
    runs-on: self-hosted
    needs:
      - deploy-nonprod
    steps:
      - name: Simulate E2E Tests
        run: |
          Write-Host "Simulating E2E Tests"

  # Load Test job
  load-test:
    runs-on: self-hosted
    needs:
      - deploy-nonprod
    steps:
      - name: Simulate Load Test
        run: |
          Write-Host "Simulating Load Test"

  # Deploy to Prod job
  deploy-prod:
    runs-on: self-hosted
    needs:
      - load-test
      - e2e-tests
    steps:
      - name: Simulate Deploy to Prod
        run: |
          Write-Host "Simulating Deploy to Prod"
