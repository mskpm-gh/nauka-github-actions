name: 10 - Controlling the execution Flow
on:
  workflow_dispatch:
    inputs:
      pass-unit-tests:
        type: boolean
        description: Whether the tests will pass or fail
        default: true

jobs:
  # Lint and Build job
  lint-build:
    runs-on: self-hosted
    steps:
      - name: Simulate Lint and Build
        shell: pwsh
        run: |
          echo "Simulating Lint and Build"
          ../dots-animation.ps1
  # Unit Test job
  unit-test:
    runs-on: self-hosted
    steps:
      - name: Simulate Unit Tests
        shell: pwsh
        run: |
          echo "Simulating Unit Tests"
          ../dots-animation.ps1
      - name: Failing test
        if: ${{ !inputs.pass-unit-tests }}
        shell: pwsh
        run: exit 1
  # Deploy to Non-Prod job
  deploy-nonprod:
    runs-on: self-hosted
    needs:
      - lint-build
      - unit-test
    steps:
      - name: Simulate Deploy to Non-Prod
        shell: pwsh
        run: |
          echo "Simulating Deploy to Non-Prod"
          ../dots-animation.ps1
  # E2E Tests job
  e2e-tests:
    runs-on: self-hosted
    needs:
      - deploy-nonprod
    steps:
      - name: Simulate E2E Tests
        run: |
          echo "Simulating E2E Tests"
          shell: pwsh
          ../dots-animation.ps1
  # Load Test job
  load-test:
    runs-on: self-hosted
    needs:
      - deploy-nonprod
    steps:
      - name: Simulate Load Test
        shell: pwsh
        run: |
          echo "Simulating Load Test"
          ../dots-animation.ps1
  # Deploy to Prod job
  deploy-prod:
    runs-on: self-hosted
    needs:
      - load-test
      - e2e-tests
    steps:
      - name: Simulate Deploy to Prod
        shell: pwsh
        run: |
          echo "Simulating Deploy to Prod"
          shell: pwsh
          ../dots-animation.ps1
