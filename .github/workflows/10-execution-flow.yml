name: 10 - Controlling the execution Flow
on:
  workflow_dispatch:
    inputs:
      pass-unit-tests:
        type: boolean
        description: Whether the tests will pass or fail
        default: true

# GLOBALNE USTAWIENIE: Zabezpiecza cały plik na Windows 11 przed zawieszaniem okien
defaults:
  run:
    shell: cmd

jobs:
  # Lint and Build job
  lint-build:
    runs-on: self-hosted
    steps:
      - name: Simulate Lint and Build
        shell: cmd
        run: |
          @echo off
          <nul set /p ="Simulating Lint and Build project"
          for /L %%i in (1,1,3) do (
              ping 127.0.0.1 -n 2 >nul
              <nul set /p ="."
          )
          :: Resetujemy ukryty błąd ERRORLEVEL pozostawiony przez komendę set /p
          cmd /c exit 0

  # Unit Test job
  unit-test:
    runs-on: self-hosted
    steps:
      - name: Simulate Unit Tests
        run: |
          echo Simulating Unit Tests
      - name: Failing test
        if: ${{ !inputs.pass-unit-tests }}
        run: exit 1

  # Deploy to Non-Prod job
  deploy-nonprod:
    runs-on: self-hosted
    needs:
      - lint-build
      - unit-test
    steps:
      - name: Simulate Deploy to Non-Prod
        run: |
          echo Simulating Deploy to Non-Prod

  # E2E Tests job
  e2e-tests:
    runs-on: self-hosted
    needs:
      - deploy-nonprod
    steps:
      - name: Simulate E2E Tests
        run: |
          echo Simulating E2E Tests

  # Load Test job
  load-test:
    runs-on: self-hosted
    needs:
      - deploy-nonprod
    steps:
      - name: Simulate Load Test
        run: |
          echo Simulating Load Test

  # Deploy to Prod job
  deploy-prod:
    runs-on: self-hosted
    needs:
      - load-test
      - e2e-tests
    steps:
      - name: Simulate Deploy to Prod
        run: |
          echo Simulating Deploy to Prod
