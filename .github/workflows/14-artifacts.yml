name: 14 - Working with Artifacts
on:
  workflow_dispatch:

env:
  build_artifact_key: app-${{ github.sha }}
  test_report_key: test-report-${{ github.sha }}

jobs:
  test-build:
    runs-on: self-hosted
    defaults:
      run:
        shell: bash
        working-directory: 14-artifacts/react-app
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20.x"

      - name: Download cache dependencies
        id: cache
        uses: actions/cache@v4
        with:
          path: 14-artifacts/react-app/node_modules
          key: deps-node-modules-${{ hashFiles('14-artifacts/react-app/package-lock.json') }}

      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm install

      - name: Unit tests
        run: npm test -- --coverage

      - name: Upload unit test results
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.test_report_key }}
          path: 14-artifacts/react-app/coverage

      - name: Build code
        run: npm run build

      - name: Upload build artifacts files
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.build_artifact_key }}
          path: 14-artifacts/react-app/build

  deploy:
    runs-on: self-hosted
    needs: test-build
    steps:
      - name: Download build artifacts files
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.build_artifact_key }}
          path: build
      - name: Show folder structure
        run: ls -R build
