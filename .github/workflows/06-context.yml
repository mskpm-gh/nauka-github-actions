name: 06-Context workflow 
run-name: 06-Context | Debug - ${{ inputs.debug }}
  
on: 
    workflow_dispatch:
        inputs:
            debug:
                type: boolean   
                description: 'Enable debug mode'
                default: false

jobs:
    echo-data:
        runs-on: ubuntu-latest
        steps:
            - name: Display information
              run: |
                    echo "Job: ${{ github.job }}"
                    echo "Event name: ${{ github.event_name }}"
                    echo "Ref: ${{ github.ref }}"
                    echo "SHA: ${{ github.sha }}"
                    echo "Actor: ${{ github.actor }}"
                    echo "Repository: ${{ github.repository }}"
                    echo "Workflow: ${{ github.workflow }}"
                    echo "Run ID: ${{ github.run_id }}"
                    echo "Run number: ${{ github.run_number }}"
            - name: Retrieve variables
              run: |
                    echo "Variable MyVar: ${{ vars.MY_VAR }}"
            - name: Retrieve some secrets
              run: |
                    echo "Azure Subscription ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}"
                    echo "Azure Tenant ID: ${{ secrets.AZURE_TENANT_ID }}"