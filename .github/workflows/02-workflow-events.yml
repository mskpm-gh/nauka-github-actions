name: 02 - Workflow Events
on:
  push:
  pull_request:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  echo-event-name:
    name: Say event name
    runs-on: self-hosted
    steps:
      - name: Echo event name
        run: echo "I'm triggered by a ${{ github.event_name }} event"
