name: 15 - Working with Matrices
on:
  workflow_dispatch:

jobs:
  backwards-compatibility:
    name: ${{ matrix.os }} - Node ${{ matrix.node-version }}
    runs-on: self-hosted
    strategy:
      fail-fast: true
      matrix:
        node-version: [19.x, 20.x]
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            node-version: 16.x
            tag: experimental
          - os: windows-latest
            node-version: 21.x
            tag: experimental
    steps:
      - name: Setup node
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
      - name: Fail if experimental
        if: ${{ matrix.tag == 'experimental' }}
        run: |
          echo "This is an experimental configuration"
          exit 1

      - name: Perform some action
        run: |
          echo "Running on ${{ matrix.os }} with Node ${{ matrix.node-version }}"
          sleep 10
      - name: Upload test results
        run: |
          echo "Uploading test results"
          sleep 5

  Include-example:
    runs-on: self-hosted
    strategy:
      matrix:
        color: [red, green]
        shape: [circle, square]
        size: [small, large]
        include:
          - color: red
            shape: circle
            size: small
          - color: green
            shape: triangle
        steps:
          - name: Dummy step
            run: |
              echo ""
