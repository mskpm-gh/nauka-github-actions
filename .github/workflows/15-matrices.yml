name: 15 - Working with Matrices
defaults:
  run:
    shell: bash
on:
  workflow_dispatch:
jobs:
  backwards-compatibility:
    name: ${{ matrix.os }} - Node ${{ matrix.node-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        node-version: [19.x, 20.x]
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            node-version: 16.x
            tag: experimental
    steps:
      - name: Setup node
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
      - name: Perform some action
        run: |
          echo "Running on ${{ matrix.os }} with Node ${{ matrix.node-version }}"
      - name: Upload test results
        run: |
          echo "Uploading test results"

  Include-example:
    name: ${{ matrix.color }} - ${{ matrix.shape }} - ${{ matrix.size }}
    runs-on: self-hosted
    strategy:
      matrix:
        color: [red, green]
        shape: [circle, square]
        size: [small, large]
        include:
          - color: red
            shape: circle
            size: small
          - color: green
            shape: triangle
        exclude:
          - color: red
            shape: circle
            size: small
    steps:
      - name: Dummy step
        run: echo ${{ matrix.color }} - ${{ matrix.shape }} - ${{ matrix.size }}
