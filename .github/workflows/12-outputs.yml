name: 12 - Working with Outputs
on:
  workflow_dispatch:
    inputs:
      build-status:
        type: choice
        options:
          - success
          - failure
        default: success

jobs:
  build:
    runs-on: self-hosted
    outputs:
      build-status: ${{ steps.build.outputs.status }}
    steps:
      - name: Print output $GITHUB_OUTPUT path
        shell: cmd
        run: echo "$GITHUB_OUTPUT"

      - name: Build
        id: build
        run: echo "status=${{ inputs.build-status }}" >> "GITHUB_OUTPUT"

  deploy:
    runs-on: self-hosted
    needs: build
    if: ${{ needs.build.outputs.build-status == 'success' }}
    steps:
      - name: Deploy
        run: echo Deploying...
