name: 17 - 2 - Custom Actions - JS
run-name: 17 - 2 - Custom Actions JS | BB ${{ inputs.base-branch }} -> TB ${{ inputs.target-branch }} WD ${{ inputs.working-dir }}

defaults:
  run:
    shell: bash
on:
  workflow_dispatch:
    inputs:
      base-branch:
        type: string
        default: main
      target-branch:
        type: string
        default: update-dependencies
      working-dir:
        type: string
        default: 17-custom-actions/react-app
      debug:
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependency-update-${{ inputs.target-branch }}
  cancel-in-progress: false

jobs:
  dependency-update:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base-branch }}
      - name: Check for NPM Dependency Updates
        id: check-updates
        uses: ./.github/actions/js-dependency-update
        with:
          base-branch: ${{ inputs.base-branch }}
          head-branch: ${{ inputs.target-branch }}
          working-directory: ${{ inputs.working-dir }}
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          debug: ${{ inputs.debug }}
      - name: Print Updates Available
        run: |
          echo "Updates available: ${{ steps.check-updates.outputs.updates-available }}"
