name: 17 - 3 - Custom Actions - Docker

defaults:
  run:
    shell: bash
on:
  workflow_dispatch:
    inputs:
      url:
        type: choice
        options:
          - "https://www.google.com"
          - "https://www.invalid-url.com"
          - "non-url-format.con"
        default: "https://www.google.com"
      max-trials:
        description: Maximum number of trials to attempt
        required: false
        default: "10"
      delay:
        description: Delay between trials in seconds
        required: false
        default: "5"

jobs:
  ping-url:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Ping URL
        uses: ./.github/actions/docker-ping-url
        with:
          url: ${{ inputs.url }}
          max-trials: ${{ inputs.max-trials }}
          delay: ${{ inputs.delay }}
