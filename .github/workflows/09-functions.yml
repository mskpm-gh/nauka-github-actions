name: 09 - Using Functions Workflow
on:
  pull_request:
  workflow_dispatch:

jobs:
  echo1:
    runs-on: self-hosted
    # Wymusza użycie PowerShell Core dla każdego kroku w tym zadaniu
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Sleep for 10 sec
        shell: cmd
        run: timeout /t 10 /nobreak

      - name: Failing Step
        run: exit 1

      - name: I will be skipped
        if: ${{ success() }}
        run: Write-Host "I will print if the previous step succeeds"

      - name: I will execute
        if: ${{ failure() }}
        run: Write-Host "I will print if the previous step fails"

      - name: I will execute
        if: ${{ !cancelled() }}
        run: Write-Host "I will always print if the previous step was not cancelled"

      - name: I will execute when canceled
        if: ${{ cancelled() }}
        run: Write-Host "I will print if the workflow will be cancelled"
